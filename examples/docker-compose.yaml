services:
  iris:
    image: intersystemsdc/iris-community:latest
    container_name: iris-haystack
    # The 2026.1 `latest` image currently fails in its IPM/ZPM entrypoint while
    # invoking irissqlcli. Start IRIS directly and perform the small amount of
    # setup required by this integration through ObjectScript instead.
    entrypoint: ["/iris-main"]
    command:
      - "--ISCAgent"
      - "false"
      - "-a"
      - "/bin/bash /usr/local/bin/iris-haystack-init.sh"
    ports:
      - "1972:1972"
      - "52773:52773"
    volumes:
      - iris-data:/usr/irissys/mgr
      - ./iris-haystack-init.sh:/usr/local/bin/iris-haystack-init.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/iris-haystack-ready && /usr/irissys/bin/iris qlist IRIS | grep -q 'running,'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  iris-data:
